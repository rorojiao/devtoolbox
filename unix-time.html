<h1>时间戳转换</h1><p class="subtitle">Unix时间戳↔日期</p><div class="card"><h3>当前时间戳</h3><div id="now" style="font-size:28px;color:#2563eb;font-weight:bold;margin:10px 0"></div><h3 style="margin-top:20px">时间戳→日期</h3><div class="form-group"><input type="number" id="ts" placeholder="输入时间戳" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;font-size:16px"></div><button class="btn" onclick="ts2d()">转</button><div id="r1" style="margin-top:10px;font-size:18px"></div><h3 style="margin-top:20px">日期→时间戳</h3><div class="form-group"><input type="datetime-local" id="dt" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;font-size:16px"></div><button class="btn" onclick="d2ts()">转</button><div id="r2" style="margin-top:10px;font-size:18px"></div></div><script>setInterval(()=>{document.getElementById("now").textContent=Math.floor(Date.now()/1000)},1000);function ts2d(){const t=+document.getElementById("ts").value;const d=new Date(t*(t>1e12?1:1000));document.getElementById("r1").innerHTML="<b>"+d.toLocaleString()+"</b>"}function d2ts(){const d=new Date(document.getElementById("dt").value);document.getElementById("r2").innerHTML="秒：<b>"+Math.floor(d.getTime()/1000)+"</b><br>毫秒：<b>"+d.getTime()+"</b>"}</script>
