<h1>chmod计算器</h1><p class="subtitle">数字↔rwx</p><div class="card"><div class="form-group"><label>chmod数字(如755)</label><input type="text" id="n" value="755" oninput="calc()" maxlength="3"></div><div id="r" style="margin-top:15px;font-size:18px"></div><h3 style="margin-top:20px">可视化</h3><table style="width:100%;text-align:center"><tr><th></th><th>r</th><th>w</th><th>x</th></tr><tr><td>Owner</td><td><input type="checkbox" class="pm" data-p="0" data-v="4" checked onchange="fromCb()"></td><td><input type="checkbox" class="pm" data-p="0" data-v="2" checked onchange="fromCb()"></td><td><input type="checkbox" class="pm" data-p="0" data-v="1" checked onchange="fromCb()"></td></tr><tr><td>Group</td><td><input type="checkbox" class="pm" data-p="1" data-v="4" checked onchange="fromCb()"></td><td><input type="checkbox" class="pm" data-p="1" data-v="2" onchange="fromCb()"></td><td><input type="checkbox" class="pm" data-p="1" data-v="1" checked onchange="fromCb()"></td></tr><tr><td>Others</td><td><input type="checkbox" class="pm" data-p="2" data-v="4" checked onchange="fromCb()"></td><td><input type="checkbox" class="pm" data-p="2" data-v="2" onchange="fromCb()"></td><td><input type="checkbox" class="pm" data-p="2" data-v="1" checked onchange="fromCb()"></td></tr></table></div><script>function calc(){const n=document.getElementById("n").value;if(!/^[0-7]{3}$/.test(n))return;const m=n.split("").map(d=>{const v=+d;return(v&4?"r":"-")+(v&2?"w":"-")+(v&1?"x":"-")});document.getElementById("r").innerHTML="符号：<b>"+m.join("")+"</b><br>命令：<code>chmod "+n+" file</code>"}function fromCb(){const d=[0,0,0];document.querySelectorAll(".pm").forEach(c=>{if(c.checked)d[+c.dataset.p]+=+c.dataset.v});document.getElementById("n").value=d.join("");calc()}calc()</script>
