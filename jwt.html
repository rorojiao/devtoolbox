<h1>JWT解析</h1><p class="subtitle">解码Token</p><div class="card"><div class="form-group"><label>JWT</label><textarea id="jwt" rows="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;font-family:monospace;word-break:break-all">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c</textarea></div><button class="btn" onclick="decode()">解析</button><div id="r" style="margin-top:15px"></div></div><script>function decode(){const t=document.getElementById("jwt").value.trim().split(".");if(t.length!==3){document.getElementById("r").innerHTML="<p style=color:red>无效JWT</p>";return}try{const h=JSON.parse(atob(t[0].replace(/-/g,"+").replace(/_/g,"/"))),p=JSON.parse(atob(t[1].replace(/-/g,"+").replace(/_/g,"/")));let e="";if(p.exp){const d=new Date(p.exp*1000);e="<p>⏰ "+d.toLocaleString()+(d<new Date()?" <span style=color:red>已过期</span>":" <span style=color:green>未过期</span>")+"</p>"}document.getElementById("r").innerHTML="<div class=card style=margin-top:10px><h3>Header</h3><pre style=background:#f1f5f9;padding:12px;border-radius:8px>"+JSON.stringify(h,null,2)+"</pre></div><div class=card style=margin-top:10px><h3>Payload</h3><pre style=background:#f1f5f9;padding:12px;border-radius:8px>"+JSON.stringify(p,null,2)+"</pre>"+e+"</div>"}catch(e){document.getElementById("r").innerHTML="<p style=color:red>解析失败</p>"}}</script>
