<h1>Markdown预览</h1><p class="subtitle">实时编辑预览</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px"><div class="card" style="height:400px;display:flex;flex-direction:column"><h3>✏️编辑</h3><textarea id="md" style="flex:1;width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-family:monospace;resize:none" oninput="render()">## Hello\n**粗体** `代码`\n- 列表1\n- 列表2\n> 引用</textarea></div><div class="card" style="height:400px;overflow-y:auto"><h3>👁️预览</h3><div id="out" style="line-height:1.8"></div></div></div><style>@media(max-width:768px){div[style*=grid-template-columns]{grid-template-columns:1fr!important}}</style><script>function render(){let t=document.getElementById("md").value;t=t.replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>");t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code style=background:#f1f5f9;padding:2px_6px;border-radius:4px>$1</code>");t=t.replace(/^> (.+)$/gm,"<blockquote style=border-left:4px_solid_#2563eb;padding-left:12px;color:#666>$1</blockquote>");t=t.replace(/^- (.+)$/gm,"<li>$1</li>").replace(/\n/g,"<br>");document.getElementById("out").innerHTML=t}render()</script>
